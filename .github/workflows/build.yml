name: Build PRIME Pro APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/prime/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # BUILD.GRADLE (Added lifecycle-service library to fix Context error)
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.prime.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.prime.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.9.0'
              
              // CameraX & Lifecycle dependencies
              def camerax_version = "1.3.1"
              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-video:${camerax_version}"
              implementation 'androidx.lifecycle:lifecycle-service:2.6.2'
          }
          EOF

          # THEMES
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
              <style name="Theme.Transparent" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:backgroundDimEnabled">false</item>
              </style>
              <style name="CircleButton">
                  <item name="android:background">@drawable/circle_bg</item>
                  <item name="android:textColor">#FFFFFF</item>
                  <item name="android:textStyle">bold</item>
                  <item name="android:textSize">20sp</item>
              </style>
          </resources>
          EOF

          # CIRCLE BUTTON BACKGROUND
          cat << 'EOF' > app/src/main/res/drawable/circle_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#E53935"/> 
              <stroke android:width="4dp" android:color="#FFFFFF"/>
          </shape>
          EOF

          # APP ICON
          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#111111"/>
          </shape>
          EOF
          
          # MANIFEST
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              
              <uses-feature android:name="android.hardware.camera" />
              
              <application 
                  android:label="Prime" 
                  android:icon="@drawable/app_icon" 
                  android:theme="@style/Theme.Transparent" 
                  android:requestLegacyExternalStorage="true">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service 
                      android:name=".RecordingService" 
                      android:exported="false" 
                      android:foregroundServiceType="camera|microphone" />
              </application>
          </manifest>
          EOF

          # MAIN ACTIVITY LAYOUT
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:id="@+id/main_layout">
              
              <Button
                  android:id="@+id/btn_start"
                  style="@style/CircleButton"
                  android:layout_width="150dp"
                  android:layout_height="150dp"
                  android:layout_centerInParent="true"
                  android:text="START" />
                  
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_below="@id/btn_start"
                  android:layout_centerHorizontal="true"
                  android:layout_marginTop="20dp"
                  android:text="Tap Start to Setup"
                  android:textColor="#888888"
                  android:textSize="16sp"/>
          </RelativeLayout>
          EOF
          
          # RECORDING SERVICE (Fixed Context issues)
          cat << 'EOF' > app/src/main/java/com/prime/app/RecordingService.java
          package com.prime.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.video.MediaStoreOutputOptions;
          import androidx.camera.video.Recorder;
          import androidx.camera.video.Recording;
          import androidx.camera.video.VideoCapture;
          import androidx.camera.video.VideoRecordEvent;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import androidx.lifecycle.LifecycleService;
          import com.google.common.util.concurrent.ListenableFuture;

          public class RecordingService extends LifecycleService {
              public static boolean isRecording = false;
              private Recording activeRecording = null;
              private ProcessCameraProvider cameraProvider;

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("PRIME_REC", "System Process", NotificationManager.IMPORTANCE_MIN);
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                  }
                  Notification notification = new NotificationCompat.Builder(this, "PRIME_REC")
                          .setContentTitle("Android System")
                          .setContentText("Running in background")
                          .setSmallIcon(android.R.drawable.ic_menu_info_details)
                          .build();
                  startForeground(1, notification);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  super.onStartCommand(intent, flags, startId);
                  
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      stopRecording();
                  } else if (!isRecording) {
                      startCameraX();
                  }
                  return START_STICKY;
              }

              private void startCameraX() {
                  ListenableFuture<ProcessCameraProvider> cameraProviderFuture = ProcessCameraProvider.getInstance(getApplicationContext());
                  cameraProviderFuture.addListener(() -> {
                      try {
                          cameraProvider = cameraProviderFuture.get();
                          Recorder recorder = new Recorder.Builder().build();
                          VideoCapture<Recorder> videoCapture = VideoCapture.withOutput(recorder);
                          
                          cameraProvider.unbindAll();
                          cameraProvider.bindToLifecycle(RecordingService.this, CameraSelector.DEFAULT_BACK_CAMERA, videoCapture);
                          
                          ContentValues contentValues = new ContentValues();
                          contentValues.put(MediaStore.MediaColumns.DISPLAY_NAME, "PRIME_" + System.currentTimeMillis());
                          contentValues.put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4");
                          
                          MediaStoreOutputOptions options = new MediaStoreOutputOptions.Builder(getContentResolver(), MediaStore.Video.Media.EXTERNAL_CONTENT_URI)
                                  .setContentValues(contentValues).build();
                                  
                          activeRecording = videoCapture.getOutput().prepareRecording(getApplicationContext(), options)
                                  .withAudioEnabled()
                                  .start(ContextCompat.getMainExecutor(getApplicationContext()), event -> {
                                      if (event instanceof VideoRecordEvent.Finalize) {
                                          Toast.makeText(getApplicationContext(), "Video Saved to Gallery!", Toast.LENGTH_LONG).show();
                                      }
                                  });
                                  
                          isRecording = true;
                          Toast.makeText(getApplicationContext(), "Recording Started...", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          e.printStackTrace();
                          Toast.makeText(getApplicationContext(), "Camera Error", Toast.LENGTH_SHORT).show();
                      }
                  }, ContextCompat.getMainExecutor(getApplicationContext()));
              }

              private void stopRecording() {
                  if (activeRecording != null) {
                      activeRecording.stop();
                      activeRecording = null;
                  }
                  if (cameraProvider != null) {
                      cameraProvider.unbindAll();
                  }
                  isRecording = false;
                  stopForeground(true);
                  stopSelf();
              }
          }
          EOF

          # MAIN ACTIVITY 
          cat << 'EOF' > app/src/main/java/com/prime/app/MainActivity.java
          package com.prime.app;
          
          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  prefs = getSharedPreferences("PrimeApp", MODE_PRIVATE);
                  boolean isFirstTime = prefs.getBoolean("isFirstTime", true);

                  if (!isFirstTime && hasPermissions()) {
                      toggleRecording();
                      finish(); 
                      return;
                  }
                  
                  setTheme(R.style.Theme_App);
                  setContentView(R.layout.activity_main);
                  
                  Button btnStart = findViewById(R.id.btn_start);
                  btnStart.setOnClickListener(v -> {
                      if (hasPermissions()) {
                          prefs.edit().putBoolean("isFirstTime", false).apply();
                          toggleRecording();
                          finish(); 
                      } else {
                          requestPermissions();
                      }
                  });

                  if (!hasPermissions()) {
                      requestPermissions();
                  }
              }

              private boolean hasPermissions() {
                  int camera = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA);
                  int audio = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO);
                  return camera == PackageManager.PERMISSION_GRANTED && audio == PackageManager.PERMISSION_GRANTED;
              }

              private void requestPermissions() {
                  String[] permissions;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions = new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS};
                  } else {
                      permissions = new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO, Manifest.permission.WRITE_EXTERNAL_STORAGE};
                  }
                  ActivityCompat.requestPermissions(this, permissions, 100);
              }

              private void toggleRecording() {
                  Intent serviceIntent = new Intent(this, RecordingService.class);
                  if (RecordingService.isRecording) {
                      serviceIntent.setAction("STOP");
                      startService(serviceIntent); 
                  } else {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-Final-APK
          path: app/build/outputs/apk/debug/app-debug.apk
