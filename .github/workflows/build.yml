name: Build PRIME One-Click APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/prime/app
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.prime.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.prime.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.9.0'
          }
          EOF

          # THEMES (Added Transparent Theme so app doesn't show UI on second click)
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
              <style name="Theme.Transparent" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowIsFloating">true</item>
                  <item name="android:backgroundDimEnabled">false</item>
              </style>
              <style name="CircleButton">
                  <item name="android:background">@drawable/circle_bg</item>
                  <item name="android:textColor">#FFFFFF</item>
                  <item name="android:textStyle">bold</item>
                  <item name="android:textSize">20sp</item>
              </style>
          </resources>
          EOF

          # CIRCLE BUTTON BACKGROUND
          cat << 'EOF' > app/src/main/res/drawable/circle_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#E53935"/> <!-- Red Color for Start -->
              <stroke android:width="4dp" android:color="#FFFFFF"/>
          </shape>
          EOF

          # APP ICON Placeholder
          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#111111"/>
          </shape>
          EOF
          
          # MANIFEST
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              
              <application 
                  android:label="Prime" 
                  android:icon="@drawable/app_icon" 
                  android:theme="@style/Theme.Transparent" 
                  android:requestLegacyExternalStorage="true">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".RecordingService" android:exported="false" android:foregroundServiceType="camera" />
              </application>
          </manifest>
          EOF

          # MAIN ACTIVITY LAYOUT (First time UI with Circle Button)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:id="@+id/main_layout">
              
              <Button
                  android:id="@+id/btn_start"
                  style="@style/CircleButton"
                  android:layout_width="150dp"
                  android:layout_height="150dp"
                  android:layout_centerInParent="true"
                  android:text="START" />
                  
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_below="@id/btn_start"
                  android:layout_centerHorizontal="true"
                  android:layout_marginTop="20dp"
                  android:text="Setup: Tap Start"
                  android:textColor="#888888"
                  android:textSize="16sp"/>
          </RelativeLayout>
          EOF
          
          # RECORDING SERVICE (Handles Background logic & Gallery Saving)
          cat << 'EOF' > app/src/main/java/com/prime/app/RecordingService.java
          package com.prime.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.media.MediaScannerConnection;
          import android.os.Build;
          import android.os.Environment;
          import android.os.IBinder;
          import android.widget.Toast;
          import java.io.File;

          public class RecordingService extends Service {
              public static boolean isRunning = false;
              private File videoFile;

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("PRIME_REC", "System Service", NotificationManager.IMPORTANCE_MIN);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                      Notification notification = new Notification.Builder(this, "PRIME_REC").setContentTitle("").setContentText("").build();
                      startForeground(1, notification);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  isRunning = true;
                  // TODO: Here goes the Camera2 API background recording logic (1x1 pixel view)
                  
                  // Setup File path for Gallery
                  File moviesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES);
                  videoFile = new File(moviesDir, "PRIME_EVIDENCE_" + System.currentTimeMillis() + ".mp4");
                  
                  Toast.makeText(this, "Recording Started", Toast.LENGTH_SHORT).show();
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  isRunning = false;
                  // TODO: Stop MediaRecorder here
                  
                  // VERY IMPORTANT: This makes the video visible in the Gallery instantly
                  if (videoFile != null) {
                      MediaScannerConnection.scanFile(this, new String[]{videoFile.getAbsolutePath()}, new String[]{"video/mp4"}, null);
                      Toast.makeText(this, "Saved to Gallery!", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # MAIN ACTIVITY (Handles Logic: First Time UI vs Transparent Icon Click)
          cat << 'EOF' > app/src/main/java/com/prime/app/MainActivity.java
          package com.prime.app;
          
          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  prefs = getSharedPreferences("PrimeApp", MODE_PRIVATE);
                  boolean isFirstTime = prefs.getBoolean("isFirstTime", true);

                  if (!isFirstTime && hasPermissions()) {
                      // NOT First Time: Act as a toggle switch and close immediately (Icon click logic)
                      toggleRecording();
                      finish(); // Closes the transparent activity instantly
                      return;
                  }
                  
                  // FIRST TIME ONLY: Show the UI with the Circle Button
                  setTheme(R.style.Theme_App); // Change to solid black theme for UI
                  setContentView(R.layout.activity_main);
                  
                  Button btnStart = findViewById(R.id.btn_start);
                  btnStart.setOnClickListener(v -> {
                      if (hasPermissions()) {
                          prefs.edit().putBoolean("isFirstTime", false).apply();
                          toggleRecording();
                          finish(); // Close UI, from now on it will act as a toggle
                      } else {
                          requestPermissions();
                      }
                  });

                  if (!hasPermissions()) {
                      requestPermissions();
                  }
              }

              private boolean hasPermissions() {
                  int camera = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA);
                  int audio = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO);
                  int storage = ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      return camera == PackageManager.PERMISSION_GRANTED && audio == PackageManager.PERMISSION_GRANTED;
                  }
                  return camera == PackageManager.PERMISSION_GRANTED && audio == PackageManager.PERMISSION_GRANTED && storage == PackageManager.PERMISSION_GRANTED;
              }

              private void requestPermissions() {
                  String[] permissions;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      permissions = new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO, Manifest.permission.FOREGROUND_SERVICE};
                  } else {
                      permissions = new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO, Manifest.permission.WRITE_EXTERNAL_STORAGE};
                  }
                  ActivityCompat.requestPermissions(this, permissions, 100);
              }

              private void toggleRecording() {
                  Intent serviceIntent = new Intent(this, RecordingService.class);
                  if (RecordingService.isRunning) {
                      stopService(serviceIntent); // Stops and triggers Gallery Save
                  } else {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-OneClick-APK
          path: app/build/outputs/apk/debug/app-debug.apk
